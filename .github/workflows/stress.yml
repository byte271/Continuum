name: Race and stress gates

# A 12% intermittent failure passed ordinary CI repeatedly by luck, because
# ordinary CI runs each test once. These gates exist to make that impossible:
# they repeat the historically racy tests enough times to catch the observed
# rates, and they retain the first failing iteration instead of discarding it.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full-suite soak, 03:17 UTC.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  targeted:
    # Repeats only the two historically racy harnesses, so it stays fast
    # enough to run on every pull request.
    name: targeted repeats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actions/setup-python does not offer 3.12.13 on windows-2025, and this
      # project requires that exact patch version. uv provides identical
      # python-build-standalone interpreters on all three platforms.
      - name: Provision exact CPython 3.12.13
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install 3.12.13
          PYBIN_RESOLVED="$(uv python find 3.12.13)"
          echo "PYBIN=$PYBIN_RESOLVED" >> "$GITHUB_ENV"
          # pylint is not a runtime dependency; it backs the static gate that
          # catches undefined and unbound names in release-only scripts.
          # uv interpreters are PEP 668 externally managed, so a plain
          # `pip install` is refused there.
          "$PYBIN_RESOLVED" -m pip install --quiet --break-system-packages pylint             || "$PYBIN_RESOLVED" -m pip install --quiet pylint
          "$PYBIN_RESOLVED" -c "import pylint; print('pylint', pylint.__version__)"

      - name: Preflight - exact interpreter and expected discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$("$PYBIN" -c "import platform; print(platform.python_version())")
          test "$version" = "3.12.13" || {
            echo "expected CPython 3.12.13, got $version"; exit 1; }
          count=$("$PYBIN" -c "import unittest; l=unittest.TestLoader(); s=l.discover('tests', top_level_dir='.'); assert not l.errors, l.errors; f=lambda x: sum(map(f,x)) if isinstance(x,unittest.TestSuite) else 1; print(f(s))")
          echo "discovered $count tests"
          # A mistyped module name would otherwise repeat nothing, silently.
          # The gate tracks the published suite size. A loose floor -- this read
          # `-ge 160` against a 402-test suite -- passes a regression that
          # silently drops more than half of discovery, which is precisely what
          # this preflight exists to catch.
          # Captured with `|| documented=""` because `set -e` plus `pipefail`
          # would otherwise abort on a no-match grep, killing the job before the
          # diagnostic below can say why. `sed -n 1p` rather than `head -1` so a
          # second match cannot SIGPIPE the producer under pipefail.
          documented=$(grep -oE '[0-9]{2,4} tests' docs/TESTING.md \
            | sed -n 1p | cut -d' ' -f1) || documented=""
          test -n "$documented" || { echo "docs/TESTING.md states no count"; exit 1; }
          test "$count" -eq "$documented" || {
            echo "discovery $count does not match the documented $documented"
            exit 1; }

      - name: Repeat the targeted race regressions
        shell: bash
        env:
          # Both races were observed on Windows, which is also the slowest
          # host here; 50 repeats of each catches a 1-in-25 rate with margin.
          REPEATS: 50
        run: |
          set -Eeuo pipefail
          mkdir -p stress-logs
          status=0
          # Each target is repeated and reported separately, so a green job
          # cannot hide which target ran fewer times or was skipped.
          for target in \
            tests.test_cli_demo \
            tests.test_adversarial_restart \
            tests.test_process_independent \
            tests.test_harness_hold \
            tests.test_anti_replay_controls \
            tests.test_session.PublishedDocumentReadTests; do
            pass=0; fail=0
            for i in $(seq 1 "$REPEATS"); do
              if "$PYBIN" -m unittest "$target" > "stress-logs/${target}-${i}.log" 2>&1; then
                pass=$((pass+1))
                rm -f "stress-logs/${target}-${i}.log"
              else
                fail=$((fail+1))
                # Keep the first failing iteration only; later ones are noise.
                if [ "$fail" -gt 1 ]; then rm -f "stress-logs/${target}-${i}.log"; fi
                status=1
              fi
            done
            echo "$target: $pass passed, $fail failed of $REPEATS" \
              | tee -a stress-logs/summary.txt
            # A target that did not run its repeats is a failure, not a pass.
            if [ "$((pass+fail))" -ne "$REPEATS" ]; then
              echo "$target: expected $REPEATS iterations, saw $((pass+fail))" \
                | tee -a stress-logs/summary.txt
              status=1
            fi
          done
          echo "--- per-target summary ---"
          cat stress-logs/summary.txt
          exit "$status"

      - name: Static checks
        if: always()
        shell: bash
        run: |
          # Deterministic, so it runs once and its output stays visible.
          "$PYBIN" -m unittest -v tests.test_static_checks

      - name: Documentation consistency
        if: always()
        shell: bash
        run: |
          "$PYBIN" -m unittest tests.test_documentation_consistency

      - name: Compatibility corpus
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" -m compatibility.runner \
            --output "stress-logs/corpus-${{ matrix.os }}.json"
          "$PYBIN" - <<'PY'
          import json, glob
          for path in glob.glob("stress-logs/corpus-*.json"):
              rows = json.load(open(path, encoding="utf-8"))["results"]
              full = sum(
                  1 for r in rows
                  if r["compile"] == "passed" and r["run"] == "passed"
                  and r["same_process"] == "passed"
                  and r["new_process"] == "passed" and r["cp_python_output_match"]
              )
              print(f"{path}: {full}/{len(rows)} = {100.0*full/len(rows):.1f}%")
          PY

      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-targeted-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: warn
          path: stress-logs
          retention-days: 30

  nightly-soak:
    # The full suite, repeated. Scheduled only: too slow for pull requests.
    name: full suite soak (${{ matrix.os }} x${{ matrix.repeats }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            repeats: 20
          - os: ubuntu-24.04
            repeats: 20
          # macOS runners are the scarcest and most expensive minute here, and
          # neither observed race was macOS-specific: one was Windows-only
          # (atomic-replace EACCES) and the other was host-speed dependent and
          # reproduced on Windows. Ten repeats still catches a 1-in-8 rate with
          # high probability. Raise this if a macOS-specific flake ever appears.
          - os: macos-26
            repeats: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actions/setup-python does not offer 3.12.13 on windows-2025, and this
      # project requires that exact patch version. uv provides identical
      # python-build-standalone interpreters on all three platforms.
      - name: Provision exact CPython 3.12.13
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install 3.12.13
          PYBIN_RESOLVED="$(uv python find 3.12.13)"
          echo "PYBIN=$PYBIN_RESOLVED" >> "$GITHUB_ENV"
          # pylint is not a runtime dependency; it backs the static gate that
          # catches undefined and unbound names in release-only scripts.
          # uv interpreters are PEP 668 externally managed, so a plain
          # `pip install` is refused there.
          "$PYBIN_RESOLVED" -m pip install --quiet --break-system-packages pylint             || "$PYBIN_RESOLVED" -m pip install --quiet pylint
          "$PYBIN_RESOLVED" -c "import pylint; print('pylint', pylint.__version__)"

      - name: Repeat the full suite and retain the first failure
        shell: bash
        env:
          REPEATS: ${{ matrix.repeats }}
        run: |
          set -Eeuo pipefail
          mkdir -p stress-logs
          pass=0; fail=0; failed_tests=""
          for i in $(seq 1 "$REPEATS"); do
            if "$PYBIN" -m unittest discover -s tests -v \
                 > "stress-logs/full-${i}.log" 2>&1; then
              pass=$((pass+1))
              rm -f "stress-logs/full-${i}.log"
            else
              fail=$((fail+1))
              names=$(grep -E "^(FAIL|ERROR):" "stress-logs/full-${i}.log" \
                        | sed 's/ (.*//' | sort -u | tr '\n' ' ' || true)
              failed_tests="${failed_tests}iteration ${i}: ${names}"$'\n'
              # Every failing iteration is kept: a soak exists to collect them.
            fi
          done
          "$PYBIN" - <<PY | tee stress-logs/report.json
          import json, platform, sys
          print(json.dumps({
              "commit": "${{ github.sha }}",
              "platform": "${{ matrix.os }}",
              "python_version": platform.python_version(),
              "continuum_version": __import__("continuum").__version__,
              "ir_version": __import__("continuum").IR_VERSION,
              "repeats": int("${REPEATS}"),
              "passed": $pass,
              "failed": $fail,
              "failed_tests": """${failed_tests}""".strip().splitlines(),
          }, indent=2))
          PY
          echo "$pass passed / $fail failed of $REPEATS on ${{ matrix.os }}"
          test "$fail" -eq 0

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-soak-${{ matrix.os }}-${{ github.run_id }}
          if-no-files-found: warn
          path: stress-logs
          retention-days: 30
