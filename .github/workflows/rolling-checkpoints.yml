name: Rolling checkpoint gates

# The rolling checkpoint feature is the only crash-recovery path in the
# repository, so its correctness has to be established before merge rather than
# after. This workflow is deliberately cheap -- no two-machine evidence
# transfer, no CPython source build -- so it can run on every pull request
# without the cost of the cross-platform and cross-Python proofs.
#
# It also runs the full suite. `runtime-bundles.yml` and the nightly soak are
# the only other jobs that execute every test, and both are push- or
# schedule-only, so without this no pull request would run the suite at all.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkpoints:
    name: checkpoints (${{ matrix.os }} / ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        python: ["3.12.13", "3.13.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actions/setup-python does not offer these exact patch versions on every
      # runner image, and this project requires exact patch versions. uv
      # provides identical python-build-standalone interpreters on all three.
      - name: Provision exact CPython ${{ matrix.python }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install "${{ matrix.python }}"
          PYBIN_RESOLVED="$(uv python find "${{ matrix.python }}")"
          echo "PYBIN=$PYBIN_RESOLVED" >> "$GITHUB_ENV"

      - name: Preflight - exact interpreter and documented discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$("$PYBIN" -c "import platform; print(platform.python_version())")
          test "$version" = "${{ matrix.python }}" || {
            echo "expected CPython ${{ matrix.python }}, got $version"; exit 1; }
          count=$("$PYBIN" -c "import unittest; l=unittest.TestLoader(); s=l.discover('tests', top_level_dir='.'); assert not l.errors, l.errors; f=lambda x: sum(map(f,x)) if isinstance(x,unittest.TestSuite) else 1; print(f(s))")
          echo "discovered $count tests"
          documented=$(grep -oE '[0-9]{2,4} tests' docs/TESTING.md \
            | sed -n 1p | cut -d' ' -f1) || documented=""
          test -n "$documented" || { echo "docs/TESTING.md states no count"; exit 1; }
          test "$count" -eq "$documented" || {
            echo "discovery $count does not match the documented $documented"
            exit 1; }

      # Reported separately from the full suite so a green suite can never hide
      # a skipped or silently shrunken crash-injection matrix.
      - name: Rolling checkpoint store, scheduler, and CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          "$PYBIN" -m unittest -v \
            tests.test_checkpoint_store \
            tests.test_checkpoint_cli

      - name: Crash injection at every commit stage
        shell: bash
        run: |
          set -Eeuo pipefail
          "$PYBIN" -m unittest -v tests.test_checkpoint_crash_injection

      # The hostile one: a real process is killed without warning and recovered
      # in a separate process. SIGKILL on POSIX, TerminateProcess on Windows.
      - name: Forceful termination and recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          "$PYBIN" -m unittest -v tests.test_checkpoint_process_crash

      - name: Full suite
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" -m unittest discover -s tests

      - name: Image format compatibility is unbroken
        shell: bash
        run: |
          set -Eeuo pipefail
          # The checkpoint block is additive and optional. These are the
          # existing format, migration, and refusal suites: they must not
          # change behaviour because a new optional manifest key exists.
          "$PYBIN" -m unittest \
            tests.test_image_refusals \
            tests.test_execution_abi \
            tests.test_migration

  benchmark:
    name: checkpoint benchmark (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Provision exact CPython 3.12.13
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install 3.12.13
          echo "PYBIN=$(uv python find 3.12.13)" >> "$GITHUB_ENV"

      # Runs so the benchmark cannot rot, and so pause and write-amplification
      # figures are reproducible. Runner numbers are noisy shared-tenant
      # figures and are NOT the published measurements in PERFORMANCE.md.
      - name: Measure rolling checkpoints
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" benchmarks/measure_checkpoints.py \
            --iterations 20000 \
            --intervals 100ms,1s \
            --output "$RUNNER_TEMP/checkpoint-benchmark.json" > /dev/null
          "$PYBIN" - "$RUNNER_TEMP/checkpoint-benchmark.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print(report["system"], report["machine"], report["python_version"])
          for name, entry in report["workloads"].items():
              for interval, measured in entry["intervals"].items():
                  pause = measured["pause_seconds"]
                  if pause is None:
                      print(f"{name} {interval}: no checkpoint due")
                      continue
                  print(
                      f"{name} {interval}: commits={measured['checkpoints_committed']} "
                      f"coalesced={measured['coalesced_ticks']} "
                      f"pause_median_ms={pause['median'] * 1000:.1f} "
                      f"amp_in_window="
                      f"{measured['write_amplification_in_history_window']:.1f}x"
                  )
                  assert measured["failures"] == 0, measured
          PY

      - name: Upload benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkpoint-benchmark-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/checkpoint-benchmark.json
          retention-days: 30
