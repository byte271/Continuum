name: Live source-code migration proof

# Cross-OS, cross-ISA, cross-Python, cross-source-revision.
#
# Source: revision A, native Linux x86_64, CPython 3.12.13. Freezes through the
# public CLI, commits the image, and exits.
# Target: revision B, native Apple Silicon macOS arm64, CPython 3.13.14. Only
# after the image exists is revision B introduced and the migration plan built.
#
# The oracle lives in validation/live_migration/proof.py and is stated
# independently of the migration implementation.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - live-code-migration-v0.5

permissions:
  contents: read

env:
  SOURCE_PYTHON: 3.12.13
  TARGET_PYTHON: 3.13.14
  REVISION_A: validation/live_migration/programs/revision_a.py
  REVISION_B: validation/live_migration/programs/revision_b.py
  HOLD_SAFE_POINT: "60"

jobs:
  revision-a-source:
    name: revision A / Linux x86_64 / CPython 3.12.13
    runs-on: ubuntu-24.04
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      image_sha256: ${{ steps.freeze.outputs.image_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify a clean native Linux x86_64 source tree
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Provision exact CPython ${{ env.SOURCE_PYTHON }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install "$SOURCE_PYTHON"
          PYBIN_RESOLVED="$(uv python find "$SOURCE_PYTHON")"
          echo "PYBIN=$PYBIN_RESOLVED" >> "$GITHUB_ENV"
          test "$("$PYBIN_RESOLVED" -c 'import platform; print(platform.python_version())')" = "$SOURCE_PYTHON"

      - name: Run the full suite on the source runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" -m unittest discover -s tests

      - name: Confirm revision B is not present in the source job
        shell: bash
        run: |
          set -Eeuo pipefail
          # The image must be created before the new revision is introduced.
          # Revision B exists in the tree, but the source job never reads it;
          # this records that its content played no part in the freeze.
          echo "revision_b_sha256=$(shasum -a 256 "$REVISION_B" | cut -d' ' -f1)"

      - name: Freeze revision A through the public CLI
        id: freeze
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" validation/live_migration/proof.py source \
            --python "$PYBIN" \
            --revision-a "$REVISION_A" \
            --output "$RUNNER_TEMP/migration-source" \
            --hold-safe-point "$HOLD_SAFE_POINT" \
            --expect-python "$SOURCE_PYTHON" \
            --commit "$GITHUB_SHA"
          image="$RUNNER_TEMP/migration-source/revision-a.cont"
          test -s "$image"
          echo "image_sha256=$(shasum -a 256 "$image" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Confirm the source exited with four live frames
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" - <<'PY'
          import json, os
          from pathlib import Path
          evidence = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "migration-source"
               / "source-evidence.json").read_text()
          )
          process = evidence["source_process"]
          assert process["exited_and_reaped_before_target"] is True, evidence
          assert process["exit_status"] == 0, evidence
          assert evidence["freeze"]["source_alive_when_request_published"] is True
          assert "Frames: 4" in evidence["inspect_stdout"], evidence["inspect_stdout"]
          assert evidence["prefix_lines"] > 0, evidence
          print(evidence["inspect_stdout"])
          PY

      - name: Upload the revision-A image and prefix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-source-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/migration-source
          retention-days: 90

  revision-b-target:
    name: revision B / macOS arm64 / CPython 3.13.14
    needs: revision-a-source
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify a clean native Apple Silicon target
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "${{ needs.revision-a-source.outputs.source_commit }}"
          test -z "$(git status --porcelain=v1)"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sysctl -in sysctl.proc_translated 2>/dev/null || echo 0)" = 0

      - name: Provision exact CPython ${{ env.TARGET_PYTHON }} independently
        shell: bash
        run: |
          set -Eeuo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          uv python install "$TARGET_PYTHON"
          PYBIN_RESOLVED="$(uv python find "$TARGET_PYTHON")"
          echo "PYBIN=$PYBIN_RESOLVED" >> "$GITHUB_ENV"
          test "$("$PYBIN_RESOLVED" -c 'import platform; print(platform.python_version())')" = "$TARGET_PYTHON"

      - name: Run the full suite on the target runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" -m unittest discover -s tests

      - name: Download the revision-A image after the source job finished
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: migration-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-artifact

      - name: Confirm the image arrived byte-identical
        shell: bash
        run: |
          set -Eeuo pipefail
          source_dir="$RUNNER_TEMP/source-artifact"
          if [[ -d "$source_dir/migration-source" ]]; then
            source_dir="$source_dir/migration-source"
          fi
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          actual="$(shasum -a 256 "$source_dir/revision-a.cont" | cut -d' ' -f1)"
          test "$actual" = "${{ needs.revision-a-source.outputs.image_sha256 }}"

      - name: Confirm revision B differs from revision A in future behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          # Guard against a proof that would pass with an inert edit.
          ! diff -q "$REVISION_A" "$REVISION_B" >/dev/null
          grep -q "FINAL-V2" "$REVISION_B"
          grep -q "NEWMARK" "$REVISION_B"
          ! grep -q "NEWMARK" "$REVISION_A"

      - name: Plan, verify, and resume under revision B
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" validation/live_migration/proof.py target \
            --python "$PYBIN" \
            --revision-b "$REVISION_B" \
            --input "$SOURCE_DIR" \
            --output "$RUNNER_TEMP/migration-final" \
            --expect-python "$TARGET_PYTHON" \
            --commit "$GITHUB_SHA"

      - name: Assert every required proof property
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=. "$PYBIN" - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "migration-final"
               / "final-report.json").read_text()
          )
          source, target = report["source"], report["target"]
          image, migrated, oracle = (
              report["image"], report["migration"], report["oracle"]
          )

          assert source["os"] == "Linux", report
          assert source["architecture"] == "x86_64", report
          assert source["python_version"] == "3.12.13", report
          assert target["os"] == "Darwin", report
          assert target["architecture"] == "arm64", report
          assert target["python_version"] == "3.13.14", report

          assert report["cross_os"] is True, report
          assert report["cross_architecture"] is True, report
          assert report["cross_python"] is True, report
          assert report["cross_source_revision"] is True, report

          assert source["exited_and_reaped_before_target"] is True, report
          assert image["byte_identical_in_transit"] is True, report
          assert image["unchanged_by_migration"] is True, report

          assert migrated["mapping_is_total"] is True, migrated
          assert migrated["active_frames_mapped"] >= 4, migrated
          assert migrated["classes_mapped"] >= 1, migrated
          assert "Verification: passed" in migrated["verify_stdout"], migrated
          assert "Independently re-derived: True" in migrated["verify_stdout"]
          assert "Migration applied" in migrated["resume_stderr"], migrated

          assert oracle["completed_actions_repeated"] == 0, oracle
          assert oracle["total_actions"] == 30, oracle
          assert oracle["prefix_actions"] > 0, oracle
          assert oracle["suffix_actions"] > 0, oracle
          assert oracle["old_future_behavior_executed"] is False, oracle
          assert oracle["new_future_behavior_executed"] is True, oracle
          assert report["oracle_failures"] == [], report["oracle_failures"]

          print(json.dumps(report, indent=2, sort_keys=True))
          print("PROOF: cross-OS, cross-ISA, cross-Python, cross-revision migration")
          PY

      - name: Upload the complete migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-final-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/migration-final
          retention-days: 90
